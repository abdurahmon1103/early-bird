name: Check new posts

on:
  workflow_dispatch:
    # Lets you manually trigger a run from the GitHub Actions tab,
    # useful for testing without waiting for the schedule.

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run watcher
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MY_PROXY_URL: ${{ secrets.MY_PROXY_URL }}
        run: python run.py

      - name: Commit updated database back to repository
        run: |
          git config user.name "new-post-checker-bot"
          git config user.email "actions@github.com"
          git add watcher.db
          git diff --staged --quiet || git commit -m "Update last-seen state [skip ci]"
          git push
